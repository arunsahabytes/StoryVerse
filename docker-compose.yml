services:
  backend:
    build: ./server
    container_name: storyverse-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - storyverse-network

networks:
  storyverse-network:
    driver: bridge
